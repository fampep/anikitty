# Local Postgres for AniKitty development.
# App itself is usually run with `npm run dev` against this DB.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: anikitty
      POSTGRES_PASSWORD: anikitty
      POSTGRES_DB: anikitty
    volumes:
      - anikitty_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anikitty -d anikitty"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anikitty_pg:
